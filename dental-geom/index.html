<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentalGeom - 3D Dental Mesh Viewer</title>
</head>
<body>
<!-- Left Sidebar -->
<div id="ui">
    <button class="hide-all-btn" id="hideAllBtn">Hide All</button>

    <!-- Mesh List Section -->
    <div class="mesh-section">
        <div class="section-header" id="meshSectionHeader">
            Show / Hide
        </div>
        <div class="mesh-list" id="meshList">
            <!-- Meshes will be added here dynamically -->
        </div>
    </div>

    <!-- Cross-Section Tool -->
    <div class="tool-section">
        <h3>Cross-Section</h3>
        <div class="toggle-control">
            <input type="checkbox" id="crossSectionToggle" />
            <label for="crossSectionToggle">Enable Cross-Section</label>
        </div>

        <button id="setPlaneBtn" class="small-btn" disabled>Set Plane with 2 Points</button>
        <p id="crossSectionStatus" class="status-text"></p>

        <div class="slider-control">
            <label>
                Position: <span id="crossSectionValue">0.0</span>
            </label>
            <input
                    type="range"
                    id="crossSectionSlider"
                    min="-100"
                    max="100"
                    value="0"
                    step="0.1"
                    disabled
            />
        </div>
    </div>

    <!-- Measurement Tool -->
    <div class="tool-section">
        <h3>Measurement Tool</h3>
        <div class="toggle-control">
            <input type="checkbox" id="measurementToggle" />
            <label for="measurementToggle">Enable Measurement</label>
        </div>
        <button id="clearMeasurement" class="small-btn">Clear Measurements</button>
        <p class="tool-hint">Click two points on the mesh to measure distance</p>
    </div>
</div>

<!-- Settings Modal (hidden by default) -->
<div id="settingsOverlay" class="settings-overlay" style="display: none;"></div>
<div id="settingsModal" class="settings-modal" style="display: none;">
    <div class="settings-header">
        <h2>Settings</h2>
        <button class="settings-close" id="settingsClose">×</button>
    </div>

    <div class="settings-section">
        <h3>Camera</h3>
        <div class="settings-option">
            <label for="cameraProjection">Projection</label>
            <select id="cameraProjection">
                <option value="perspective">Perspective</option>
                <option value="orthographic">Orthographic</option>
            </select>
        </div>
    </div>

    <div class="settings-section">
        <h3>Display</h3>
        <div class="settings-option">
            <label for="flatShadingToggle">Flat Shading</label>
            <input type="checkbox" id="flatShadingToggle" />
        </div>
        <div class="settings-option">
            <label for="glossyTextureToggle">Glossy Texture</label>
            <input type="checkbox" id="glossyTextureToggle" />
        </div>
    </div>

    <div class="settings-section">
        <h3>Tools</h3>
        <div class="settings-option">
            <label for="settingsMeasurementToggle">Measurement Tool</label>
            <input type="checkbox" id="settingsMeasurementToggle" />
        </div>
        <div class="settings-option">
            <label for="settingsCrossSectionToggle">Cross-Section</label>
            <input type="checkbox" id="settingsCrossSectionToggle" />
        </div>
    </div>
</div>

<!-- Right Side Circular Buttons -->
<div class="right-controls">
    <button class="circle-btn close" id="closeBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        Close
    </button>

    <button class="circle-btn settings" id="settingsBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Settings
    </button>

    <label for="fileInput" class="circle-btn add">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add Mesh
        <input type="file" id="fileInput" accept=".stl" />
    </label>
</div>

<!-- Bottom Right View Controls -->
<div class="view-controls">
    <div class="view-label">Default view</div>
    <div class="direction-grid">
        <div class="dir-btn" data-view="top">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
            </svg>
        </div>
        <div class="dir-btn" data-view="bottom">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </div>

        <div class="dir-btn" data-view="left">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </div>
        <div class="dir-btn" data-view="right">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </div>

        <div class="dir-btn" data-view="back">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 20V4m0 0l-4 4m4-4l4 4" />
            </svg>
        </div>
        <div class="dir-btn" data-view="front">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m0 0l-4-4m4 4l4-4" />
            </svg>
        </div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
